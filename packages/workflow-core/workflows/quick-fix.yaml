id: quick-fix
label: Quick Fix
description: >-
  Short workflow for a small, explicitly specified change. The requested outcome
  is already clear, so there is no evidence reconciliation, no business gate and
  no independent review: locate the narrow cause, make the smallest correct
  change, validate it focusedly, stop. Escalates to standard-change for LEVEL 2
  or a full bug-fix/feature-change workflow for LEVEL 3 when concrete evidence
  shows the narrow path does not hold.

nodes:
  - id: prompt
    label: User Prompt
    kind: start
    description: An explicit request whose expected result is already clear.

  - id: triage
    label: Triage
    skill: wf-quick-fix
    description: >-
      Locate the relevant implementation and confirm this is L0 or L1. Direct
      code path only — no repository scan or document review. Root cause is
      required for an L1 defect, not for a mechanical L0 edit.

  - id: fix
    label: Fix
    skill: wf-quick-fix
    description: Smallest causal change. No unrelated refactor, no optional improvements.

  - id: validate
    label: Validate
    skill: wf-quick-fix
    description: >-
      Focused validation — nearest test, cheap typecheck/build, or one runtime
      probe. Plus a lightweight diff check. Not the full suite, not the reviewer
      agent.

  - id: done
    label: Done
    kind: end

edges:
  - from: prompt
    to: triage
  - from: triage
    to: fix
  - from: fix
    to: validate
  - from: validate
    to: fix
    label: focused failure
  - from: validate
    to: done
