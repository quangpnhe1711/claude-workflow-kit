id: feature-change
label: Feature Change
description: >-
  Controlled feature/change workflow. Reconcile evidence, resolve business
  behavior behind a hard gate, plan impact/risk/scope/tests, implement,
  validate proportionally, review independently, assess, report. This full
  workflow is reserved for LEVEL 3 risk; E2E is conditional, not automatic.

nodes:
  - id: prompt
    label: User Prompt
    kind: start
    description: Task and evidence inputs received.

  - id: evidence
    label: Evidence Analysis
    skill: wf-evidence-reconciliation
    artifact: evidence.md
    description: Reconcile intent, requirement documents, DB, code and tests. Surface contradictions.

  - id: freshness
    label: Analysis Freshness
    defaultSkipped: true
    skill: wf-feature-from-analysis
    artifacts:
      - business-analysis.md
      - impact-analysis.md
      - solution-options.md
      - recommended-solution.md
      - implementation-plan.md
      - test-strategy.md
    description: >-
      Linked-analysis path only. Verify relevant source hashes and reuse the
      approved artifact package. If stale, refresh only affected analysis and
      keep BUSINESS_READY closed. Legacy feature runs do not enter this node.

  - id: business
    label: Business Decision
    skill: wf-business-decision
    gate: BUSINESS_READY
    artifact: business-decision.md
    description: Resolve desired business behavior. Coding forbidden until BUSINESS_READY.

  - id: await-business
    label: Waiting For User
    kind: waiting
    gate: BUSINESS_READY
    description: A material business decision is open. Waiting for the user.

  - id: readiness
    label: Impact / Risk / Scope
    skill: wf-change-readiness
    artifacts:
      - implementation-plan.md
      - impact-risk-scope.md
      - test-strategy.md
    description: Implementation plan, cross-module impact, risks, scope boundaries, test strategy.

  - id: conventions
    label: Conventions
    skill: wf-convention-manager
    description: Load cached conventions, refresh only missing or stale areas.

  - id: implementation
    label: Implementation
    skill: wf-implement
    description: Smallest correct change within approved scope.

  - id: validation
    label: Validation
    skill: wf-validation-e2e
    artifact: validation.md
    description: Execute the predefined test strategy with evidence.

  - id: e2e
    label: E2E
    skill: wf-validation-e2e
    description: >-
      Runtime/end-to-end verification only when the risk and remaining coverage
      gap justify it. Otherwise mark this phase skipped with the reason.

  - id: review
    label: Independent Review
    agent: independent-reviewer
    artifact: review.md
    description: Independent read-only review of the final diff. Max 3 fix loops.

  - id: assessment
    label: Product Assessment
    skill: wf-product-assessment
    artifact: assessment.md
    description: Evidence-backed product/technical observations. Report-only.

  - id: report
    label: Final Report
    skill: wf-final-report
    artifact: final-report.md
    description: Compact outcome, evidence, risks, recommendations.

  - id: done
    label: Done
    kind: end

edges:
  - from: prompt
    to: evidence
    label: legacy / direct feature request
  - from: prompt
    to: freshness
    label: approved analysis handoff
  - from: freshness
    to: conventions
    label: analysis valid
  - from: evidence
    to: business
  - from: business
    to: await-business
    when: "!BUSINESS_READY"
    label: blocked
  - from: await-business
    to: business
    label: answered
  - from: business
    to: readiness
    when: BUSINESS_READY
    label: ready
  - from: readiness
    to: conventions
  - from: conventions
    to: implementation
  - from: implementation
    to: validation
  - from: validation
    to: e2e
    label: E2E justified
  - from: validation
    to: review
    label: E2E not justified
  - from: e2e
    to: review
  - from: review
    to: implementation
    label: findings
  - from: review
    to: assessment
  - from: assessment
    to: report
  - from: report
    to: done
